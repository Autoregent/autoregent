[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoregent"
version = "0.1.0"
description = "An API gateway that heals failing upstreams but is structurally incapable of doing it silently."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [{ name = "Vladlen" }]
keywords = ["api-gateway", "gemini", "llm", "self-healing", "proxy", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "google-genai>=1.3",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/vladlen-codes/autoregent"
Documentation = "https://github.com/vladlen-codes/autoregent/blob/main/DOCUMENTATION.md"
Repository = "https://github.com/vladlen-codes/autoregent"

[project.scripts]
autoregent = "autoregent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/autoregent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
